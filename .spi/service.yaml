schemaVersion: 4
service:
  name: open-vds
  archetype: native-container-azure
  sourcePath: .
  image:
    context: .
    dockerfile: .spi/image/Dockerfile
tests:
  acceptance:
    type: script
    path: .spi
    entrypoint: acceptance/run.sh
    arguments:
      - "--workflow-url"
      - "${WORKFLOW_URL}"
      - "--partition"
      - "${PARTITION}"
      - "--token"
      - "${TOKEN}"
      - "--workflow-name"
      - "${WORKFLOW_NAME}"
      - "--report"
      - "acceptance/results/workflow.xml"
    reportPaths:
      - acceptance/results/workflow.xml
    dependencies:
      - workflow
    timeoutMinutes: 10
    bindings:
      WORKFLOW_URL: { source: gateway, suffix: /api/workflow/v1 }
      PARTITION: { source: partition }
      TOKEN: { source: token }
      WORKFLOW_NAME: { source: static, value: segy-to-vds-conversion }
